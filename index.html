<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সন্ধান – পোস্ট ফ্রেম মেকার</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Baloo+Da+2:wght@800&display=swap">
<style>
:root{--bg:#eaf7ee;--card:#fff;--ink:#123524;--mut:#4f7a62;--line:#cde6d4;--a:#15803d;--b:#25a45a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f16;--card:#14291e;--ink:#e4f6ea;--mut:#9bc4aa;--line:#24432f}}
:root[data-theme="dark"]{--bg:#0d1f16;--card:#14291e;--ink:#e4f6ea;--mut:#9bc4aa;--line:#24432f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:26px;font-weight:700}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1100px;margin:auto;padding:12px 16px 32px;display:grid;gap:20px;grid-template-columns:minmax(0,360px) minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;align-content:start}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input[type=text],input[type=date],select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=file]{font:inherit;font-size:13px;width:100%}
.drop{border:2px dashed var(--b);border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{background:var(--bg)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));color:#fff}
button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.prev{display:grid;gap:12px;align-content:start;justify-items:center}
.prev canvas{width:100%;max-width:520px;height:auto;border-radius:10px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.out{display:none;text-align:center;font-size:14px;color:var(--mut)}
.out img{max-width:100%;width:260px;border-radius:8px;border:1px solid var(--line);display:block;margin:8px auto}
small{color:var(--mut)}
.lang{float:right;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lb{background:transparent;color:var(--mut);padding:6px 14px;border-radius:999px;font-size:14px}
.lb.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff}
[hidden]{display:none!important}
.grp{display:grid;gap:14px}
textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:0 0 auto;padding:6px 16px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.tab.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent}
.lbl{display:grid;gap:5px;font-weight:600;font-size:14px}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.th{flex:1 1 72px;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;display:grid;gap:5px;justify-items:center}
.th i{display:block;width:100%;height:18px;border-radius:6px}
.th.on{border-color:var(--b)}
</style>
</head>
<body>
<header>
<div class="lang"><button type="button" class="lb on" data-l="bn">বাংলা</button><button type="button" class="lb" data-l="en">English</button></div>
<h1>সন্ধান – পোস্ট ফ্রেম মেকার</h1>
<p>সার্কুলারের ছবি দিন, ফ্রেমে বসে যাবে। তারপর ডাউনলোড করে ফেসবুকে পোস্ট করুন।</p>
</header>
<main>
<section class="panel">
<div class="tabs"><button type="button" class="tab on" data-m="job">জব</button><button type="button" class="tab" data-m="e">এক্সাম</button><button type="button" class="tab" data-m="q">MCQ</button></div>
<div id="imgF" class="grp">
<div class="drop" id="drop" tabindex="0" role="button">স্ক্রিনশট কপি করে <b>Ctrl+V</b> চাপুন<br><small>অথবা ছবি টেনে আনুন / ক্লিক করে বেছে নিন</small></div>
<input type="file" id="file" accept="image/*" hidden>
</div>
<div id="jobF" class="grp">
<label>পোস্টের হেডলাইন (হেডারে বসবে)<textarea id="title" rows="2" placeholder="যেমন: বাংলাদেশ ব্যাংকে নিয়োগ বিজ্ঞপ্তি"></textarea><small>Enter চাপলে নতুন লাইনে যাবে (সর্বোচ্চ ৩ লাইন)</small></label>
<label>পরীক্ষার তারিখ (ঐচ্ছিক, ছবির উপরে দেখাবে)<input type="date" id="exam"></label>
<label>আবেদন শুরুর তারিখ (ঐচ্ছিক)<input type="date" id="start"></label>
<label>আবেদনের শেষ তারিখ (ঐচ্ছিক)<input type="date" id="dead"></label>
</div>
<div id="qF" class="grp" hidden>
<label>প্রশ্ন (হেডিংয়ে বসবে)<textarea id="qtxt" rows="3" placeholder="এখানে প্রশ্ন লিখুন"></textarea></label>
<label>অপশন A<input type="text" id="oa"></label>
<label>অপশন B<input type="text" id="ob"></label>
<label>অপশন C<input type="text" id="oc"></label>
<label>অপশন D<input type="text" id="od"></label>
<label>সঠিক উত্তর হাইলাইট করবেন? (ঐচ্ছিক)<select id="qans"><option value="">না, হাইলাইট নয়</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></label>
</div>
<div id="eF" class="grp" hidden>
<label>পরীক্ষার নাম / বিজ্ঞপ্তি (ঐচ্ছিক, হেডারে বসবে)<textarea id="etitle" rows="2" placeholder="যেমন: বাংলাদেশ ব্যাংক অফিসার নিয়োগ পরীক্ষা"></textarea></label>
<label>পরীক্ষার ধরন (যা লিখবেন হুবহু তা-ই দেখাবে)<input type="text" id="etype" list="etypes" placeholder="যেমন: ব্যবহারিক পরীক্ষার তারিখ"></label>
<datalist id="etypes"><option value="লিখিত পরীক্ষার তারিখ"><option value="ব্যবহারিক পরীক্ষার তারিখ"><option value="মৌখিক পরীক্ষার তারিখ"><option value="MCQ পরীক্ষার তারিখ"><option value="প্রিলিমিনারি পরীক্ষার তারিখ"><option value="দক্ষতা পরীক্ষার তারিখ"></datalist>
<label>পরীক্ষার তারিখ<input type="date" id="edate"></label>
</div>
<div class="lbl">থিম<div class="themes" id="themes"></div></div>
<label>ফ্রেমের সাইজ
<select id="size"><option value="0">অটো – ছবির সাইজ অনুযায়ী ফ্রেম বড়/ছোট হবে</option><option value="1080">বর্গ (১:১) – 1080×1080</option><option value="1350">পোর্ট্রেট (৪:৫) – 1080×1350</option></select></label>
<label>লোগো বদলাতে চান? (ঐচ্ছিক, ডিফল্ট লোগো বসানো আছে)<input type="file" id="logo" accept="image/*"></label>
<div class="row"><button id="make">ছবি তৈরি করুন</button><button class="alt" id="clear">মুছে ফেলুন</button></div>

</section>
<section class="prev">
<canvas id="cv" width="1080" height="1080"></canvas>
<div class="out" id="out"><b>তৈরি!</b> ডাউনলোড না হলে নিচের ছবিতে ডান ক্লিক (বা মোবাইলে চেপে ধরে) “ছবি সংরক্ষণ” দিন।<img id="res" alt="তৈরি পোস্ট"></div>
</section>
</main>
